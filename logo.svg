<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Hex body: pointy-top, center (100,100), r=93 -->
  <polygon
    points="100,7 180.5,53.5 180.5,146.5 100,193 19.5,146.5 19.5,53.5"
    fill="url(#hexGrad)"
    stroke="#0c4a6e"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- === Fanned documents (left side) === -->
  <!-- Doc 1: back, tilted left -->
  <g transform="translate(62, 102) rotate(-18)">
    <path d="M -12,-36 L -12,0 L 12,0 L 12,-30 L 6,-36 Z"
      fill="rgba(255,255,255,0.4)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 6,-36 L 6,-30 L 12,-30"
      fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- Doc 2: middle, straight -->
  <g transform="translate(62, 102)">
    <path d="M -12,-36 L -12,0 L 12,0 L 12,-30 L 6,-36 Z"
      fill="rgba(255,255,255,0.55)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 6,-36 L 6,-30 L 12,-30"
      fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- Doc 3: front, tilted right -->
  <g transform="translate(62, 102) rotate(18)">
    <path d="M -12,-36 L -12,0 L 12,0 L 12,-30 L 6,-36 Z"
      fill="rgba(255,255,255,0.75)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 6,-36 L 6,-30 L 12,-30"
      fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- === Arrow/chevron (center) === -->
  <polyline
    points="97,70 112,86 97,102"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- === Structured output lines (right side) === -->
  <line x1="124" y1="73" x2="160" y2="73" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="124" y1="86" x2="166" y2="86" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="124" y1="99" x2="152" y2="99" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- === "Doc2MD" text === -->
  <text
    x="100"
    y="157"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="0.5"
  >Doc2MD</text>
</svg>
